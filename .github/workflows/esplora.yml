name: Esplora fonti (temporaneo)

on:
  workflow_dispatch:

jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - name: File giornalieri MIMIT
        run: |
          UA="Mozilla/5.0 (autilo-dati; +https://github.com/scapinmanuel-star/autilo-dati)"
          for f in prezzo_alle_8.csv anagrafica_impianti_attivi.csv; do
            echo "===== $f"
            curl -sS -L -A "$UA" -o "$f" -w "HTTP %{http_code} %{size_download} byte %{content_type}\n" \
              "https://www.mimit.gov.it/images/exportCSV/$f" || true
            head -c 900 "$f"; echo
            echo "righe: $(wc -l < "$f")"
          done
          echo "===== carburanti distinti (prime 40 per frequenza)"
          tail -n +3 prezzo_alle_8.csv | awk -F'|' '{print $2" | self="$4}' | sort | uniq -c | sort -rn | head -40
          echo "===== tipi impianto"
          tail -n +3 anagrafica_impianti_attivi.csv | awk -F'|' '{print $4}' | sort | uniq -c | sort -rn | head
          echo "===== date dtComu (le 10 più frequenti)"
          tail -n +3 prezzo_alle_8.csv | awk -F'|' '{print substr($5,1,10)}' | sort | uniq -c | sort -rn | head
      - name: Pagine con link
        run: |
          UA="Mozilla/5.0 (autilo-dati; +https://github.com/scapinmanuel-star/autilo-dati)"
          for u in \
            "https://www.mimit.gov.it/it/open-data/elenco-dataset/carburanti-archivio-prezzi" \
            "https://www.mimit.gov.it/it/prezzo-medio-carburanti" \
            "https://www.mimit.gov.it/it/prezzo-medio-carburanti/regioni" \
            "https://www.mimit.gov.it/it/prezzo-medio-carburanti/autostrade" ; do
            echo "===== $u"
            curl -sS -L -A "$UA" "$u" -o pagina.html -w "HTTP %{http_code}\n" || true
            grep -oE 'href="[^"]+\.(csv|pdf|gz|zip|xls|xlsx)[^"]*"' pagina.html | sort -u | head -60
            grep -oE '[Aa]ggiornamento [0-9-]+' pagina.html | head -2
          done
      - name: Serie settimanale MASE (candidati)
        run: |
          UA="Mozilla/5.0 (autilo-dati; +https://github.com/scapinmanuel-star/autilo-dati)"
          for u in \
            "https://dgsaie.mise.gov.it/open_data_export.php?export-id=4&export-type=csv" \
            "https://dgsaie.mise.gov.it/prezzi_carburanti_settimanali.php" \
            "https://sisen.mase.gov.it/dgsaie/prezzi-settimanali-carburanti" \
            "https://sisen.mase.gov.it/dgsaie/open-data" \
            "https://sisen.mase.gov.it/dgsaie/api/v1/weekly-prices/report/export?format=CSV&lang=it" ; do
            echo "===== $u"
            curl -sS -L -A "$UA" "$u" -o serie.out -w "HTTP %{http_code} %{size_download} byte %{content_type} -> %{url_effective}\n" || true
            head -c 700 serie.out | tr -d '\000'; echo
            grep -oE '(href|src)="[^"]*(csv|export|api|open)[^"]*"' serie.out | sort -u | head -30 || true
          done
