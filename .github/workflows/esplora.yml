name: Esplora fonti (temporaneo)

on:
  workflow_dispatch:

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Altri indirizzi MIMIT/MASE
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for u in https://www.mise.gov.it/images/exportCSV/prezzo_alle_8.csv \
                   https://carburanti.mise.gov.it/ospzSearch/ \
                   https://carburanti.mise.gov.it/ospzApi/search/zone \
                   https://sisen.mase.gov.it/dgsaie/prezzi-settimanali-carburanti ; do
            curl -sS -L -I -A "$UA" --connect-timeout 15 -m 40 -o /dev/null \
              -w "$u -> HTTP %{http_code} ip=%{remote_ip} t_tot=%{time_total}\n" "$u" || echo "$u -> ERRORE $?"
          done
          echo "--- IPv6 mimit"
          curl -sS -6 -I --connect-timeout 15 -m 30 -o /dev/null -w "HTTP %{http_code}\n" https://www.mimit.gov.it/ || echo "ERRORE $?"
          echo "--- DNS mimit"
          getent ahosts www.mimit.gov.it | head -4
      - name: Medie Italia dal Weekly Oil Bulletin
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sS -L -A "$UA" -m 60 -o wob.html "https://energy.ec.europa.eu/data-and-analysis/weekly-oil-bulletin_en"
          LINK=$(grep -oE 'href="[^"]+"' wob.html | grep -i 'Prices_History' | head -1 | sed -E 's/href="([^"]+)"/\1/; s/&amp;/\&/g')
          curl -sS -L -A "$UA" -m 120 -o storico.xlsx "https://energy.ec.europa.eu$LINK"
          pip install -q openpyxl
          python3 - <<'EOF'
          import openpyxl, statistics, datetime as dt
          wb = openpyxl.load_workbook("storico.xlsx", read_only=True, data_only=True)
          ws = wb["Prices with taxes"]
          righe = list(ws.iter_rows(values_only=True))
          intest = righe[0]
          col = {n: intest.index(n) for n in ("IT_price_with_tax_euro95", "IT_price_with_tax_diesel", "IT_price_with_tax_LPG")}
          print("colonne", col)
          dati = [r for r in righe[3:] if isinstance(r[0], dt.datetime)]
          print("settimane", len(dati), "dal", dati[-1][0].date(), "al", dati[0][0].date())
          for r in dati[:4]:
              print(r[0].date(), [r[c] for c in col.values()])
          for anni in (1, 3, 5, 10):
              lim = dati[0][0] - dt.timedelta(days=365.25 * anni)
              sel = [r for r in dati if r[0] > lim]
              medie = [round(statistics.mean(float(r[c]) for r in sel if r[c]) / 1000, 3) for c in col.values()]
              print(f"media {anni} anni ({len(sel)} sett.):", medie)
          # buchi nella serie italiana
          vuote = [r[0].date() for r in dati[:300] if any(r[c] in (None, "") for c in col.values())]
          print("settimane senza dato IT (ultime 300):", vuote[:20])
          EOF
